# Required
version: 2

# Zensical has no native RTD integration (like the mkdocs key),
# so build the site manually and move it to the RTD output folder
build:
  os: ubuntu-24.04
  tools:
    python: '3.12'
  commands:
    - pip install -r docs/requirements.txt
    - zensical build
    - mkdir -p $READTHEDOCS_OUTPUT
    - mv site $READTHEDOCS_OUTPUT/html
